syntax = "proto2";

package io.github.mrroguekknight.drishti.network;

option java_package = "io.github.mrroguekknight.drishti.network.models";
option java_outer_classname = "StateVectorProto";

message StateVector {
  required string id = 1;
  required int64 timestamp = 2;
  optional double lat = 3;
  optional double lon = 4;
  optional double alt = 5;
  optional float vx = 6;
  optional float vy = 7;
  optional float vz = 8;
  optional float heading = 9;
  // For covariance, you can use a repeated float or a more complex structure.
  // A simple approach is to flatten the matrix in row-major order.
  repeated float covariance = 10;
}